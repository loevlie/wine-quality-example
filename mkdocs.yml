site_name: Wine Quality
site_description: Predict red-wine quality from physicochemical measurements — a complete walkthrough of ml-research-template.
repo_url: https://github.com/dennis-loevlie/wine-quality

theme:
  name: material
  palette:
    primary: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

nav:
  - Home: index.md
  - API Reference:
    - Models: api/models.md
    - Data: api/data.md
    - Utils: api/utils.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - tables
