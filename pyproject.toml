[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wine-quality"
version = "0.1.0"
description = "Predict red-wine quality from physicochemical measurements — a complete walkthrough of ml-research-template."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Dennis Loevlie", email = "loevliedenny@gmail.com" },
]
dependencies = [
    # Core
    "torch>=2.2.0",
    "lightning>=2.5.0",
    # Config (typed: pydantic schemas + tyro CLI; utils/cli.py keeps Hydra's syntax)
    "tyro>=1.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    # HP search (scripts/tune.py)
    "optuna>=4.0.0",
    # Tracking (tensorboard is included with torch)
    # Shape checking & types
    "jaxtyping>=0.2.28",
    "beartype>=0.17.0",
    # Data & stats
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    # Visualization
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    # Utilities
    "rich>=13.7.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "ipykernel>=6.29.0",
    # Debugging quality-of-life
    "lovely-tensors>=0.1.18",   # readable tensor reprs: shape, stats, NaN flags
    "torchinfo>=1.8.0",         # model summaries with output shapes + param counts
    "hypothesis-torch>=2.0.0",  # property-based tests over tensors/modules
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]
demo = [
    "gradio>=6,<7",
]
tracking-wandb = [
    "wandb>=0.16.0",
]
tracking-trackio = [
    "trackio>=0.10.0,<1",
]
stats = [
    "pingouin>=0.5.4",
]
cluster = [
    # SLURM submission for scripts/sweep.py and scripts/tune.py
    "submitit>=1.5.2",
]

[tool.setuptools.packages.find]
where = ["src"]
# --- uv: PyTorch CUDA/CPU handling ---
# Docs: https://docs.astral.sh/uv/guides/integration/pytorch/
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# --- Ruff (replaces black + isort + flake8) ---
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length (handled by formatter)
    "F722",  # jaxtyping shape annotations use string syntax ruff doesn't understand
]

[tool.ruff.lint.per-file-ignores]
# cli.py ships with the template and must stay valid on Python 3.11 —
# PEP 695 type-parameter syntax (UP047) would break those projects.
"src/wine_quality/utils/cli.py" = ["UP047"]

[tool.ruff.lint.isort]
known-first-party = ["wine_quality"]

# --- Mypy ---
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true  # relaxed mode to start

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
